<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d4fb8"/><stop offset=".55" stop-color="#1f3d99"/><stop offset="1" stop-color="#162c72"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <!-- tail rotor (behind the fin) -->
  <g transform="translate(92 70)">
    <circle r="40" fill="#94a3b8" opacity=".18"/>
    <rect x="-4" y="-40" width="8" height="80" rx="4" fill="#cbd5e1" transform="rotate(25)"/>
    <rect x="-4" y="-40" width="8" height="80" rx="4" fill="#cbd5e1" transform="rotate(-65)"/>
  </g>
  <!-- fin -->
  <path d="M168 132 L108 46 C104 40 96 38 90 42 L82 48 L104 136 Z" fill="url(#body)"/>
  <circle cx="92" cy="70" r="9" fill="#1f2937"/>
  <!-- horizontal stabiliser -->
  <path d="M200 146 L262 140 L266 150 L204 158 Z" fill="#162c72"/>
  <!-- main rotor: mast, hub, blades -->
  <rect x="512" y="64" width="16" height="34" rx="4" fill="#1f2937"/>
  <ellipse cx="520" cy="64" rx="34" ry="9" fill="#1f2937" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="150" y="56" width="740" height="9" rx="4.5" fill="#1f2937" stroke="#94a3b8" stroke-width="1.2"/>
  <!-- fuselage -->
  <path d="M846 204 C846 176 826 150 786 136 L700 112 C660 102 610 98 560 98 L470 98 C440 98 416 104 398 114 L340 128 L186 130 C170 130 150 126 140 122 L104 132 L112 148 L190 156 L330 164 C352 168 372 182 392 204 C410 224 440 236 480 238 L770 238 C818 236 846 226 846 204 Z" fill="url(#body)"/>
  <!-- engine cowling -->
  <path d="M418 108 C430 86 470 80 520 80 C580 80 630 86 652 104 L652 112 L418 114 Z" fill="#2d4fb8"/>
  <path d="M600 92 L640 96 L640 106 L600 104 Z" fill="#0b1220" opacity=".6"/>
  <!-- light stripe along the side -->
  <path d="M140 140 C260 150 380 160 470 182 C560 200 700 198 842 186 L844 198 C700 212 560 214 466 196 C376 176 262 164 140 154 Z" fill="#9cc3ff"/>
  <!-- cockpit glass -->
  <path d="M776 140 C808 150 830 168 838 190 L792 190 C784 172 772 156 752 144 Z" fill="url(#glass)"/>
  <path d="M742 140 L768 144 C780 156 786 170 790 190 L752 190 C750 172 748 156 742 140 Z" fill="url(#glass)"/>
  <!-- cabin windows -->
  <rect x="520" y="138" width="40" height="34" rx="9" fill="#e2e8f0"/>
  <rect x="572" y="138" width="40" height="34" rx="9" fill="#e2e8f0"/>
  <rect x="624" y="138" width="40" height="34" rx="9" fill="#e2e8f0"/>
  <rect x="680" y="138" width="40" height="34" rx="9" fill="#0b1220"/>
  <!-- sliding door outline -->
  <rect x="510" y="128" width="164" height="104" rx="10" fill="none" stroke="#0f1f55" stroke-width="3" opacity=".6"/>
  <!-- sponson and wheels -->
  <path d="M520 228 C540 214 640 214 660 228 C664 246 640 252 590 252 C540 252 516 246 520 228 Z" fill="#162c72"/>
  <line x1="590" y1="244" x2="590" y2="262" stroke="#1f2937" stroke-width="6"/>
  <circle cx="590" cy="272" r="13" fill="#111827"/><circle cx="590" cy="272" r="5" fill="#9ca3af"/>
  <line x1="780" y1="232" x2="780" y2="256" stroke="#1f2937" stroke-width="5"/>
  <circle cx="780" cy="264" r="10" fill="#111827"/><circle cx="780" cy="264" r="4" fill="#9ca3af"/>
  <!-- beacon and antenna -->
  <rect x="470" y="236" width="8" height="10" rx="2" fill="#ef4444"/>
  <path d="M800 140 L812 124" stroke="#1f2937" stroke-width="3"/>
</svg>
