<!doctype html><html lang="nl"><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(../web/assets/fonts/Poppins-Bold.woff2);font-weight:700}
@font-face{font-family:P;src:url(../web/assets/fonts/Poppins-Medium.woff2);font-weight:500}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#2747e8;font-family:P,sans-serif;color:#fff}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 940px 315px,rgba(110,135,255,.9),transparent 460px),linear-gradient(135deg,#4c6bff,#2747e8)}
.radar{position:absolute;left:640px;top:15px;width:600px;height:600px;border-radius:50%}
.radar i{position:absolute;border:2px solid rgba(255,255,255,.28);border-radius:50%}
.radar b{position:absolute;background:rgba(255,255,255,.16)}
.blip{position:absolute;width:16px;height:16px;border-radius:50%;background:#e11d48;box-shadow:0 0 0 8px rgba(225,29,72,.3),0 0 24px 6px rgba(225,29,72,.7)}
.sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,rgba(255,255,255,.3),transparent 70deg)}
.left{position:absolute;left:70px;top:70px;width:600px}
.brand{display:flex;align-items:center;gap:18px;font-size:40px;font-weight:700}
.brand img{width:84px;height:84px;border-radius:20px;box-shadow:0 8px 24px rgba(10,20,80,.35),0 0 0 2px rgba(255,255,255,.35)}
h1{font-size:62px;line-height:1.08;margin:44px 0 22px;letter-spacing:-.5px}
h1 b{color:#fff;background:linear-gradient(transparent 64%,rgba(225,29,72,.9) 64%,rgba(225,29,72,.9) 88%,transparent 88%)}
p{font-size:28px;font-weight:500;color:#e6ecff;margin:0;line-height:1.35}
.tag{position:absolute;left:70px;bottom:62px;display:flex;gap:14px}
.tag span{padding:9px 20px;border-radius:999px;background:rgba(255,255,255,.18);font-size:22px;font-weight:500}
.tag .r{background:#e11d48}
.craft{position:absolute;filter:drop-shadow(0 18px 30px rgba(10,20,80,.45))}
</style></head><body><div class="bg"></div>
<div class="radar"><i style="inset:0"></i><i style="inset:100px"></i><i style="inset:200px"></i><b style="left:299px;top:0;bottom:0;width:2px"></b><b style="top:299px;left:0;right:0;height:2px"></b><div class="sweep"></div><div class="blip" style="left:76%;top:20%"></div></div>
<div id="crafts"></div>
<div class="left"><div class="brand"><img src="../web/assets/img/app-icon.png">112Heli</div>
<h1 id="t"></h1><p id="s"></p></div>
<div class="tag" id="tags"></div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('t').innerHTML=q.get('t');document.getElementById('s').textContent=q.get('s');
document.getElementById('tags').innerHTML=(q.get('tags')||'').split('|').map((x,i)=>`<span class="${i==0?'r':''}">${x}</span>`).join('');
const C=JSON.parse(q.get('c'));document.getElementById('crafts').innerHTML=C.map(c=>`<img class="craft" src="../web/assets/img/${c[0]}.webp" style="left:${c[1]}px;top:${c[2]}px;width:${c[3]}px${c[4]?';transform:scaleX(-1)':''}">`).join('');
</script></body></html>
