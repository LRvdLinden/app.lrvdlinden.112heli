name: Worker

# Tests the Cloudflare Worker and deploys it (when the Cloudflare secrets are set).
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; all other values come from the
# APN_* (same APNs key as A-Alerts) and optional VERKEER_URL / VERKEER_TOKEN (the A-Alerts route to adsb.lol
# when adsb.lol refuses Cloudflare addresses).
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  pull_request:
    paths: ["worker/**"]
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm test

      - name: Diagnoseer publieke live API (zonder secrets)
        # No API credentials are printed; just the publicly exposed status and counts.
        run: |
          node --input-type=module <<'JS'
          const api = "https://112heli-api.112heli.workers.dev";
          for (const path of ["/health", "/v1/live"]) {
            try {
              const r = await fetch(api + path, { signal: AbortSignal.timeout(15000), headers: { accept: "application/json" } });
              const body = await r.json();
              if (path === "/health") {
                console.log("HEALTH", JSON.stringify({ status: r.status, ok: body.ok, lastIngest: body.lastIngest,
                  lastResult: body.lastResult, verkeer: body.verkeer }));
              } else {
                const items = body.aircraft || [];
                console.log("LIVE", JSON.stringify({ status: r.status, updated: body.updated,
                  total: items.length, airborne: items.filter(a => a.airborne).length,
                  fresh: items.filter(a => a.seen && Date.now() / 1000 - a.seen <= 120).length,
                  byType: Object.fromEntries(["trauma","politie","kustwacht","defensie","kmar","regering","bijzonder"]
                    .map(k => [k, items.filter(a => a.soort === k && a.airborne).length])) }));
              }
            } catch (e) { console.error(path, e.message); }
          }
          JS


      - name: Cloudflare-secrets aanwezig?
        id: cf
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT";
          else echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID ontbreken – alleen getest, niet gedeployd."; fi

      - name: D1-database (aanmaken als hij nog niet bestaat)
        if: steps.cf.outputs.ok == 'true' && github.event_name != 'pull_request'
        run: |
          find_id() { npx wrangler d1 list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const i=s.indexOf("[");const d=JSON.parse(s.slice(i)).find(x=>x.name==="112heli");console.log(d?d.uuid:"")}catch{console.log("")}})'; }
          if ! npx wrangler d1 list > /dev/null 2>&1; then
            echo "::error::Het Cloudflare-token mag geen D1-databases beheren. Voeg bij het token de permissie Account → D1 → Edit toe (en controleer CLOUDFLARE_ACCOUNT_ID)."
            exit 1
          fi
          ID=$(find_id)
          if [ -z "$ID" ]; then
            npx wrangler d1 create 112heli --location weur
            ID=$(find_id)
          fi
          sed -i "s/__D1_DATABASE_ID__/$ID/" wrangler.toml
          npx wrangler d1 execute 112heli --remote --file schema.sql

      - name: workers.dev-subdomein (eenmalig)
        if: steps.cf.outputs.ok == 'true' && github.event_name != 'pull_request'
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          CUR=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).result?.subdomain||"")}catch{console.log("")}})')
          if [ -n "$CUR" ]; then echo "Subdomein: $CUR.workers.dev"; exit 0; fi
          for NAME in ${{ vars.WORKERS_SUBDOMAIN || '112heli' }} lrvdlinden-112heli heli112; do
            R=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" -d "{\"subdomain\":\"$NAME\"}" "$API")
            if echo "$R" | grep -qE '"success": *true'; then echo "Subdomein geregistreerd: $NAME.workers.dev"; exit 0; fi
            echo "$NAME niet beschikbaar: $R"
          done
          echo "::error::Kon geen workers.dev-subdomein registreren. Kies er zelf een in Cloudflare (Workers & Pages → je subdomein)."
          exit 1

      - name: Deploy
        if: steps.cf.outputs.ok == 'true' && github.event_name != 'pull_request'
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log

      - name: Secrets naar de Worker
        if: steps.cf.outputs.ok == 'true' && github.event_name != 'pull_request'
        env:
          APN_KEY_ID: ${{ secrets.APN_KEY_ID }}
          APN_TEAM_ID: ${{ secrets.APN_TEAM_ID || secrets.TEAM_ID }}
          APN_P8_CERT: ${{ secrets.APN_P8_CERT }}
          VERKEER_URL: ${{ secrets.VERKEER_URL }}
          VERKEER_TOKEN: ${{ secrets.VERKEER_TOKEN }}
          WEB_MAPKIT_JS_KEY_ID: ${{ secrets.WEB_MAPKIT_JS_KEY_ID }}
          WEB_MAPKIT_JS_TEAM_ID: ${{ secrets.WEB_MAPKIT_JS_TEAM_ID }}
          WEB_MAPKIT_JS_P8: ${{ secrets.WEB_MAPKIT_JS_P8 }}
          BEHEER_USER: ${{ secrets.BEHEER_APP_USER || secrets.BEHEER_USER }}
          BEHEER_PASSWORD: ${{ secrets.BEHEER_APP_PASSWORD || secrets.BEHEER_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.KEY_ID_APPSTORE_CONNECT }}
          ASC_ISSUER_ID: ${{ secrets.ISSUER_ID_APPSTORE_CONNECT }}
          ASC_KEY_P8: ${{ secrets.APPSTORE_CONNECT_P8 }}
          ASC_VENDOR_NUMBER: ${{ secrets.VENDOR_APPSTORE_CONNECT }}
        run: |
          node -e '
            const keys = ["APN_KEY_ID","APN_TEAM_ID","APN_P8_CERT","VERKEER_URL","VERKEER_TOKEN","WEB_MAPKIT_JS_KEY_ID","WEB_MAPKIT_JS_TEAM_ID","WEB_MAPKIT_JS_P8","BEHEER_USER","BEHEER_PASSWORD","ASC_KEY_ID","ASC_ISSUER_ID","ASC_KEY_P8","ASC_VENDOR_NUMBER"];
            const out = {}; for (const k of keys) if (process.env[k]) out[k] = process.env[k];
            require("fs").writeFileSync("secrets.json", JSON.stringify(out));
            console.log("Secrets:", Object.keys(out).join(", ") || "(geen)");'
          if [ "$(cat secrets.json)" != "{}" ]; then npx wrangler secret bulk secrets.json; fi
          rm secrets.json

      - name: Adres van de API
        if: steps.cf.outputs.ok == 'true' && github.event_name != 'pull_request'
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "### API: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Controle: $URL/health" >> "$GITHUB_STEP_SUMMARY"
          echo "API: $URL"
